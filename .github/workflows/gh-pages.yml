name: Deploy demo (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_BASE: /valaxy-theme-arknights/
          SITE_URL: https://valaxyjs.github.io/valaxy-theme-arknights/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: demo/dist
      - id: deployment
        uses: actions/deploy-pages@v4
