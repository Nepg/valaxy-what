name: Deploy demo
on:
  push:
    branches:
      - main # 你的源码分支，master 就改成 master
  workflow_dispatch: # 保留手动重发能力

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: ./demo
        run: pnpm build
        env:
          # 注意：这里换成你自己的仓库名
          VITE_BASE: /valaxy-what/
          SITE_URL: https://Nepg.github.io/valaxy-what/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: demo/dist
      - id: deployment
        uses: actions/deploy-pages@v4
